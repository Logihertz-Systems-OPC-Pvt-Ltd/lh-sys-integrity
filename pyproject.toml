[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-sys-integrity"
version = "0.1.0"
description = "Verifies cryptographic SHA-256 baseline manifests against live filesystem states, inspects /etc/ld.so.preload hooks, systemd unit overrides, cron persistence jobs, and binary drift to detect host tampering and rootkits."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sys-integrity"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sys-integrity"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sys-integrity#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-sys-integrity/issues"

[project.scripts]
lh-fim = "lh_sys_integrity.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_sys_integrity"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=lh_sys_integrity --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

